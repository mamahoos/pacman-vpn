services:
  xui:
    image: ${XUI_IMAGE:-ghcr.io/mhsanaei/3x-ui}:${XUI_VERSION:-v3.2.6}

    container_name: xui

    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      TZ: ${TZ:-UTC}
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"

    volumes:
      - ./data/x-ui:/etc/x-ui
      - ./data/cert:/root/cert

    networks:
      - infra_proxy_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_proxy_net"

      # --------------------------------------------------
      # X-UI Web Panel
      # --------------------------------------------------

      - "traefik.http.routers.xui.rule=Host(`${XUI_DOMAIN}`)"
      - "traefik.http.routers.xui.entrypoints=websecure"
      - "traefik.http.routers.xui.tls=true"

      - "traefik.http.services.xui.loadbalancer.server.port=${XUI_PANEL_PORT:-2053}"

      # --------------------------------------------------
      # Security headers
      # --------------------------------------------------

      - "traefik.http.middlewares.xui-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.xui-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.xui-security.headers.stsPreload=true"
      - "traefik.http.middlewares.xui-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.xui-security.headers.frameDeny=true"

      - "traefik.http.routers.xui.middlewares=xui-security"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  infra_proxy_net:
    external: true
