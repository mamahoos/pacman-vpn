name: CD

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main
      scope:
        description: panel recreates only the panel; all recreates the stack and runs seed
        type: choice
        required: true
        default: panel
        options:
          - panel
          - all

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || 22 }}
      DEPLOY_SCOPE: ${{ inputs.scope }}
      DEPLOY_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # --- Shift left ---
      - name: Check deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Validate config and scripts
        run: |
          for f in config/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done
          python3 -m py_compile scripts/*.py

      # --- Deploy ---
      - name: Backup remote stack files
        id: backup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.DEPLOY_FINGERPRINT }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            rm -rf .deploy-backup
            mkdir -p .deploy-backup/config .deploy-backup/scripts
            cp -a compose.yaml .deploy-backup/compose.yaml
            for f in config/host.json config/xray.json scripts/seed_pasarguard.py scripts/check_cloudflare.py; do
              if [ -f "$f" ]; then cp -a "$f" ".deploy-backup/$f"; fi
            done

      - name: Copy stack files
        id: copy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.DEPLOY_FINGERPRINT }}
          source: compose.yaml,config/host.json,config/xray.json,scripts/seed_pasarguard.py,scripts/check_cloudflare.py
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Pull images and recreate
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.DEPLOY_FINGERPRINT }}
          envs: DEPLOY_PATH,DEPLOY_SCOPE
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            docker compose config -q
            case "${DEPLOY_SCOPE}" in
              panel)
                docker compose pull panel
                docker compose up -d --no-deps panel
                ;;
              all)
                docker compose pull
                docker compose up -d --remove-orphans
                set -a
                . ./.env
                set +a
                docker compose exec -T \
                  -e EDGE_DOMAIN -e EDGE_PORT -e INBOUND_WS_PATH -e NODE_API_KEY \
                  panel python3 /scripts/seed_pasarguard.py
                ;;
              *)
                echo "unknown DEPLOY_SCOPE=${DEPLOY_SCOPE}" >&2
                exit 1
                ;;
            esac

      - name: Check public edge health
        id: health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          XUI_DOMAIN: ${{ vars.XUI_DOMAIN }}
          SUB_DOMAIN: ${{ vars.SUB_DOMAIN }}
          EDGE_DOMAIN: ${{ vars.EDGE_DOMAIN }}
          XUI_BASE_PATH: ${{ secrets.XUI_BASE_PATH }}
          INBOUND_WS_PATH: ${{ vars.INBOUND_WS_PATH }}
          SMOKE_ATTEMPTS: "8"
          SMOKE_DELAY_SECONDS: "10"
        run: python3 scripts/check_cloudflare.py

      - name: Rollback on failure
        if: failure() && steps.backup.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          fingerprint: ${{ env.DEPLOY_FINGERPRINT }}
          envs: DEPLOY_PATH,DEPLOY_SCOPE
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            cp -a .deploy-backup/compose.yaml compose.yaml
            for f in config/host.json config/xray.json scripts/seed_pasarguard.py scripts/check_cloudflare.py; do
              if [ -f ".deploy-backup/$f" ]; then cp -a ".deploy-backup/$f" "$f"; fi
            done
            case "${DEPLOY_SCOPE}" in
              panel) docker compose up -d --no-deps panel ;;
              all)   docker compose up -d --remove-orphans ;;
              *)     echo "unknown DEPLOY_SCOPE=${DEPLOY_SCOPE}" >&2; exit 1 ;;
            esac