name: DNS sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview reports changes; push applies them
        type: choice
        required: true
        default: push
        options:
          - push
          - preview
  push:
    branches: [main]
    paths:
      - ".github/dns/**"
      - ".github/workflows/dns.yml"

permissions:
  contents: read

concurrency:
  group: dns-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Cloudflare DNS
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || 22 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check credentials
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Resolve origin IP over SSH
        id: origin
        run: |
          set -eu
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          ip=$(ssh -i /tmp/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'curl -s --max-time 5 ifconfig.me || curl -s --max-time 5 icanhazip.com')
          echo "origin ip: $ip"
          if ! printf '%s' "$ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "::error::Resolved value is not an IPv4 address: $ip"
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Stamp origin IP into dnsconfig
        run: sed -i "s/__ORIGIN_IP__/${{ steps.origin.outputs.ip }}/" .github/dns/dnsconfig.js

      - name: Sync records with dnscontrol
        uses: is-cool-me/dnscontrol-action@v4.34.0
        with:
          args: ${{ inputs.mode || 'push' }}
          config_file: .github/dns/dnsconfig.js
          creds_file: .github/dns/creds.json
