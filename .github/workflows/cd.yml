name: CD

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || 22 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check deploy secrets
        run: |
          missing=0
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Backup remote stack files
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            rm -rf .deploy-backup
            mkdir -p .deploy-backup/config .deploy-backup/scripts
            cp -a compose.yaml .deploy-backup/compose.yaml
            if [ -f config/host.json ]; then cp -a config/host.json .deploy-backup/config/host.json; fi
            if [ -f config/xray.json ]; then cp -a config/xray.json .deploy-backup/config/xray.json; fi
            if [ -f scripts/seed_pasarguard.py ]; then cp -a scripts/seed_pasarguard.py .deploy-backup/scripts/seed_pasarguard.py; fi
            if [ -f scripts/check_cloudflare.py ]; then cp -a scripts/check_cloudflare.py .deploy-backup/scripts/check_cloudflare.py; fi

      - name: Copy stack files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: compose.yaml,config/host.json,config/xray.json,scripts/seed_pasarguard.py,scripts/check_cloudflare.py
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Pull images and recreate
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check public edge health
        id: health
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          XUI_DOMAIN: ${{ vars.XUI_DOMAIN }}
          EDGE_DOMAIN: ${{ vars.EDGE_DOMAIN }}
          XUI_BASE_PATH: ${{ secrets.XUI_BASE_PATH }}
          INBOUND_WS_PATH: ${{ vars.INBOUND_WS_PATH }}
        run: python3 scripts/check_cloudflare.py

      - name: Restore backup after failed health
        if: steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            cp -a .deploy-backup/compose.yaml compose.yaml
            if [ -f .deploy-backup/config/host.json ]; then cp -a .deploy-backup/config/host.json config/host.json; fi
            if [ -f .deploy-backup/config/xray.json ]; then cp -a .deploy-backup/config/xray.json config/xray.json; fi
            if [ -f .deploy-backup/scripts/seed_pasarguard.py ]; then cp -a .deploy-backup/scripts/seed_pasarguard.py scripts/seed_pasarguard.py; fi
            if [ -f .deploy-backup/scripts/check_cloudflare.py ]; then cp -a .deploy-backup/scripts/check_cloudflare.py scripts/check_cloudflare.py; fi
            docker compose up -d

      - name: Fail job after rollback
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::Health check failed; remote files were restored from .deploy-backup"
          exit 1
