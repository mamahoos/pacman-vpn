name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          python3 tests/test_migration_contract.py -v
          python3 tests/test_ci_workflow.py -v
          python3 scripts/test_seed_pasarguard.py -v
          python3 scripts/test_check_cloudflare.py -v

      - name: Render compose
        run: docker compose --env-file .env.example config
